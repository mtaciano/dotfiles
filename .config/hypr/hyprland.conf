# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################
# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = wezterm
$fileManager = nemo
$menu = wofi --allow-images --show drun

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox

exec-once = dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XCURSOR_SIZE XCURSOR_THEME
exec-once = ~/.config/hypr/portalstart.sh
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = gpg-agent gpgconf --launch gpg-agent
exec-once = dbus-launch gentoo-pipewire-launcher
exec-once = hyprpaper
exec-once = hypridle
exec-once = dunst
exec-once = fcitx5 -d
exec-once = gammastep-indicator
exec-once = ~/.config/hypr/tmux.sh
exec-once = waybar
exec-once = [workspace 1 silent] wezterm
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 8 silent] 1password --ozone-platform-hint=auto

#############################
### ENVIRONMENT VARIABLES ###
#############################
# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

#####################
### LOOK AND FEEL ###
#####################
# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(6D009C)
    col.inactive_border = rgb(161a1d)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1 , 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0
    bezier = quick, 0.15, 0, 0.1, 1

    animation = global, 1, 10, default
    animation = border, 1, 3, quick
    animation = windows, 1, 4.5, easeOutQuint, gnomed
    animation = windowsIn, 1, 4.5, easeOutQuint, gnomed
    animation = windowsOut, 1, 2, almostLinear, popin
    animation = fadeIn, 1, 1.7, almostLinear
    animation = fadeOut, 1, 1.4, almostLinear
    animation = fade, 1, 3, quick
    animation = layers, 1, 3.8, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.8, almostLinear
    animation = fadeLayersOut, 1, 1.4, almostLinear
    animation = workspaces, 1, 1.9, easeInOutCubic, slide
    animation = specialWorkspace, 1, 1.9, almostLinear, slidevert
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
    middle_click_paste = false
}

cursor {
    inactive_timeout = 5
    hide_on_key_press = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,us
    kb_variant = ,intl
    kb_options = grp:rctrl_rshift_toggle

    follow_mouse = 1

    sensitivity=0.000000
    accel_profile=flat
    force_no_accel=1

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$shiftMod = SHIFT
$ctrlMod = CTRL

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more.
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, N, exec, $fileManager
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, P, exec, $menu
bind = $mainMod, D, pseudo, # dwindle
bind = $mainMod, T, exec, ~/.config/hypr/tmux.sh
bind = $mainMod, F, fullscreen,

# Screenshot bindings.
bind = $mainMod, PRINT, exec, hyprshot -m window --clipboard-only
bind = , PRINT, exec, hyprshot -m output --clipboard-only
bind = $shiftMod, PRINT, exec, hyprshot -m region --clipboard-only

# Open 1password menu.
bind = $ctrlMod SHIFT, SPACE, exec, 1password --quick-access

# Use 1password to fill input.
bind = $ctrlMod, BACKSLASH, exec, 1password --fill

# Move to urgent workspace.
bind = $mainMod, U, focusurgentorlast,

# Move focus with mainMod + arrow keys.
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9].
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9].
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad).
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia keys for volume and LCD brightness.
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl.
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86audiostop, exec, playerctl stop

# Let discord register scroll lock.
bind = , Scroll_Lock, pass, class:^(discord)$

##############################
### WINDOWS AND WORKSPACES ###
##############################
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland.
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Float some specific windows.
windowrule {
  name = windowrule-3
  float = on
  match:class = ^(nemo)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(mousepad)$
}

windowrule {
  name = windowrule-5
  float = on
  match:class = ^(com.github.wwmm.easyeffects)$
}

windowrule {
  name = windowrule-6
  float = on
  match:class = ^(org.kde.filelight)$
}

windowrule {
  name = windowrule-7
  float = on
  match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
  name = windowrule-8
  float = on
  match:class = ^(org.kde.showfoto)$
}

windowrule {
  name = windowrule-9
  float = on
  match:class = ^(org.pipewire.Helvum)$
}


# Float and pin firefox picture in picture.
windowrule {
  name = windowrule-10
  float = on
  pin = on
  match:title = ^(Picture-in-Picture)$
}


# Open some windows in specific workspaces by default.
windowrule {
  name = windowrule-11
  workspace = 2
  match:class = ^(firefox)$
}

windowrule {
  name = windowrule-12
  workspace = 2
  match:class = ^(Google-chrome)$
}

windowrule {
  name = windowrule-13
  workspace = 3
  match:class = ^(Spotify)$
}

windowrule {
  name = windowrule-14
  workspace = 4
  match:class = ^(vlc)$
}

windowrule {
  name = windowrule-15
  workspace = 5
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-16
  workspace = 6
  match:class = ^(virt-manager)$
}

windowrule {
  name = windowrule-17
  workspace = 7
  match:class = ^(org.qbittorrent.qBittorrent)$
}

windowrule {
  name = windowrule-18
  workspace = 9
  match:class = ^(steam)$
}

windowrule {
  name = windowrule-19
  workspace = 9
  match:class = ^(org.prismlauncher.PrismLauncher)$
}


# Keep 1password quick access accessible.
windowrule {
  name = windowrule-20
  float = on
  stay_focused = on
  no_max_size = on
  match:class = ^(1Password)$
  match:title = (Quick Access — 1Password)
}
